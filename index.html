```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel de Sites</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #101014;
            color: white;
        }

        /* CABEÇALHO */

        header {
            padding: 25px;
            text-align: center;
            background: #18181f;
            border-bottom: 2px solid #333;
        }

        header h1 {
            margin: 0;
            color: #ffd700;
            font-size: 32px;
        }

        header p {
            color: #aaa;
            margin-bottom: 0;
        }

        /* PAINEL */

        .painel {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .categoria {
            margin-bottom: 35px;
        }

        .categoria h2 {
            border-left: 5px solid #ffd700;
            padding-left: 12px;
            color: #ffd700;
        }

        .botoes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        /* BOTÕES */

        .botao {
            min-height: 100px;
            border: 1px solid #333;
            border-radius: 15px;
            background: #1d1d24;
            color: white;
            cursor: pointer;
            transition: .2s;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-decoration: none;
        }

        .botao:hover {
            transform: translateY(-5px);
            background: #292933;
            border-color: #ffd700;
            box-shadow: 0 8px 25px rgba(0,0,0,.4);
        }

        .icone {
            font-size: 35px;
            margin-bottom: 8px;
        }

        .nome {
            font-size: 17px;
            font-weight: bold;
        }

        .descricao {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        /* RODAPÉ */

        footer {
            text-align: center;
            color: #777;
            padding: 30px;
        }

        @media(max-width:600px) {

            header h1 {
                font-size: 25px;
            }

            .botoes {
                grid-template-columns: repeat(2, 1fr);
            }

            .botao {
                min-height: 90px;
            }

            .icone {
                font-size: 28px;
            }

            .nome {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>🌐 MEU PAINEL</h1>

    <p>
        Central de acesso aos meus sites
    </p>

</header>


<div class="painel">


    


   


   


    <!-- ==========================
         MEUS PROJETOS
    =========================== -->

    <section class="categoria">

        <h2>🎮 jogos bdsm</h2>

        <div class="botoes">

            <a class="botao"
               href="tabuleiro.html">

                <span class="icone">🎲</span>

                <span class="nome">
                    tabuleiro
                </span>

                <span class="descricao">
                    Abrir jogo
                </span>

            </a>


            <a class="botao"
               href="roleta.html">

                <span class="icone">🎯</span>

                <span class="nome">
                    Roleta
                </span>

                <span class="descricao">
                    Abrir roleta
                </span>

            </a>


            <a class="botao"
               href="#"
               target="_blank">

                <span class="icone">🤖</span>

                <span class="nome">
                    none
                </span>

                <span class="descricao">
                    Assistente
                </span>

            </a>

        </div>

    </section>

</div>


<footer>

    Painel de atalhos • HTML + CSS

</footer>

</body>
</html>
